<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>6쪽 문장</title>
<style>html{min-height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}body{margin:24px 20px;font:17px/1.7 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}#s{margin-top:24px;font-size:15px;opacity:.6}</style>
</head>
<body>
<p id="t">아래 지금 코드에서 드럼이 울리는 자리를 1마디 16칸 표로 그려 줘. 각 박을 네 칸으로 나누고, 줄 이름은 쿵·짝·챠-·치로 써 줘. 소리를 새로 치는 칸은 ●, 새로 치지 않는 칸은 ·로 표시해 줘. 코드는 그대로 두고 표부터 보여 줘.</p>
<p id="s">화면을 누르면 복사</p>
<script>
var T="아래 지금 코드에서 드럼이 울리는 자리를 1마디 16칸 표로 그려 줘. 각 박을 네 칸으로 나누고, 줄 이름은 쿵·짝·챠-·치로 써 줘. 소리를 새로 치는 칸은 ●, 새로 치지 않는 칸은 ·로 표시해 줘. 코드는 그대로 두고 표부터 보여 줘.",s=document.getElementById("s"),t=document.getElementById("t");
function ok(){s.textContent="복사 완료";}
function pick(){try{var r=document.createRange();r.selectNodeContents(t);var g=getSelection();g.removeAllRanges();g.addRange(r);}catch(e){}s.textContent="길게 눌러 복사";}
function old(){try{var a=document.createElement("textarea");a.value=T;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;opacity:0";document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,T.length);var k=document.execCommand("copy");document.body.removeChild(a);k?ok():pick();}catch(e){pick();}}
function copy(){try{navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(T).then(ok,old):old();}catch(e){old();}}
document.addEventListener("click",copy);
try{navigator.clipboard.writeText(T).then(ok,function(){});}catch(e){}
</script>
</body>
</html>
