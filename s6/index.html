<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>p.6 소리 듣기</title>
<style>body{margin:24px 20px;font:17px/1.7 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}section{margin:0 0 40px}h2{margin:0 0 10px;font-size:17px;font-weight:700;text-decoration:underline;text-underline-offset:5px}p{margin:0}.t{cursor:pointer;-webkit-tap-highlight-color:transparent}.s{margin-top:8px;font-size:14px;opacity:.6}audio{display:block;width:100%;max-width:560px;margin-top:4px}html.one{min-height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<section>
<h2>p.6 소리 듣기</h2>
<audio controls preload="metadata" src="example.mp3"></audio>
</section>
<script>
function done(s){s.textContent="복사 완료";}
function pick(t,s){try{var r=document.createRange();r.selectNodeContents(t);var g=getSelection();g.removeAllRanges();g.addRange(r);}catch(e){}s.textContent="길게 눌러 복사";}
function old(x,t,s){try{var a=document.createElement("textarea");a.value=x;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;opacity:0";document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,x.length);var k=document.execCommand("copy");document.body.removeChild(a);k?done(s):pick(t,s);}catch(e){pick(t,s);}}
function copy(t){var x=t.textContent,s=t.nextElementSibling;try{navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(x).then(function(){done(s);},function(){old(x,t,s);}):old(x,t,s);}catch(e){old(x,t,s);}}
var a=document.querySelectorAll(".t"),i;
if(document.documentElement.className=="one"&&a.length==1){document.addEventListener("click",function(){copy(a[0]);});try{navigator.clipboard.writeText(a[0].textContent).then(function(){done(a[0].nextElementSibling);},function(){});}catch(e){}}
else for(i=0;i<a.length;i++)a[i].addEventListener("click",function(){copy(this);});
</script>
</body>
</html>
